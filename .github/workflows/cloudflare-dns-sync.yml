name: Cloudflare DNS Sync

# Safety net for the no-load-balancer setup: if ECS replaces a task between
# deploys (crash, failed health check, AWS maintenance), the new task gets a
# new public IP. This job re-points each environment's hostnames at whatever
# tasks are healthy right now. It only writes when something differs, and it
# never removes the last record.
#
# Production values are pinned here (as in ci.yml) so a stray repository
# variable can never redirect production DNS. Staging is skipped until
# vars.STAGING_ECS_SERVICE and vars.STAGING_DNS_NAMES are set.
#
# GitHub runs schedules on the default branch and may delay them under load.
# In a public repository, scheduled workflows are paused after 60 days with no
# repository activity; re-enable it from the Actions tab if that happens.

# Off until you enable it: set the repository variable ECS_DNS_SYNC_ENABLED
# to "true" (Settings > Secrets and variables > Actions > Variables) once the
# first production deploy to ECS has succeeded. Until then this job is skipped
# instead of failing every 5 minutes.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # AWS OIDC when vars.AWS_ROLE_ARN is set

concurrency:
  group: cloudflare-dns-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Point ${{ matrix.environment }} at healthy ECS tasks
    if: vars.ECS_DNS_SYNC_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: production
            ecs_cluster: default
            ecs_service: nauricare-api-0acf
            dns_names: nauricare.org www.nauricare.org deploy-check.nauricare.org
          - environment: staging
            ecs_cluster: ${{ vars.STAGING_ECS_CLUSTER || 'nauricare-staging' }}
            ecs_service: ${{ vars.STAGING_ECS_SERVICE }}
            dns_names: ${{ vars.STAGING_DNS_NAMES }}
    env:
      AWS_REGION: us-east-1
      ECS_CLUSTER: ${{ matrix.ecs_cluster }}
      ECS_SERVICE: ${{ matrix.ecs_service }}
      DNS_NAMES: ${{ matrix.dns_names }}
      MODE: reconcile
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      # A matrix entry can't skip its own job, so every step checks this.
      CONFIGURED: ${{ matrix.ecs_service != '' && matrix.dns_names != '' }}
    steps:
      - name: Not configured
        if: env.CONFIGURED != 'true'
        run: echo "::notice::${{ matrix.environment }} is not configured yet (set STAGING_ECS_SERVICE and STAGING_DNS_NAMES); skipping."

      - name: Checkout Sync Script
        if: env.CONFIGURED == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts

      - name: AWS credentials (OIDC)
        if: env.CONFIGURED == 'true' && vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: AWS credentials (static keys, legacy)
        if: env.CONFIGURED == 'true' && vars.AWS_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Reconcile Cloudflare DNS
        if: env.CONFIGURED == 'true'
        run: .github/scripts/cloudflare-ecs-dns.sh
