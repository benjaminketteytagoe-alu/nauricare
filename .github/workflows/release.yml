name: Release

# release-please keeps a "Release vX.Y.Z" PR open on main, built from
# Conventional Commit messages. Merging it tags the release and publishes the
# changelog. Requires Settings > Actions > General > "Allow GitHub Actions to
# create and approve pull requests".

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
