name: CI

# One pipeline, three stages:
#   1. checks   quality, database and e2e jobs run in parallel on every PR and push
#   2. image    on push: build once, scan, attach an SBOM, sign, push to ECR by SHA
#   3. deploy   develop -> staging, main -> production (manual approval), both
#               deploying the exact image digest built in stage 2
# Deploy mechanics live in the reusable deploy-ecs.yml.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-progress runs for the same PR; never cancel branch pushes, so a
# half-finished deploy is never interrupted.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"
  PRISMA_SCHEMA: packages/database/prisma/schema.prisma
  AWS_REGION: us-east-1
  ECR_REPOSITORY: nauricare-api
  # Cloudflare's always-pass Turnstile test key; real keys are only used in the image build.
  TURNSTILE_TEST_SITE_KEY: 1x00000000000000000000AA

jobs:
  # ===========================================================================
  # 1. CHECKS
  # ===========================================================================
  quality:
    name: Format, Lint, Typecheck, Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema="$PRISMA_SCHEMA"
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests with coverage
        run: npm run test:coverage --workspace=web
      - name: Coverage summary
        if: always()
        run: node .github/scripts/coverage-summary.mjs apps/web/coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"

  database:
    name: Migrations Apply Cleanly & Match Schema
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: nauricare_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d nauricare_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/nauricare_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma validate --schema="$PRISMA_SCHEMA"
      # Proves every migration applies from scratch and that the result matches
      # schema.prisma exactly (catches forgotten or broken migrations).
      - name: Apply migrations and check for drift
        run: |
          npx prisma migrate deploy --schema="$PRISMA_SCHEMA"
          if ! npx prisma migrate diff --from-url "$DATABASE_URL" \
                 --to-schema-datamodel "$PRISMA_SCHEMA" --exit-code; then
            echo "::error::schema.prisma has changes with no migration. Create one with 'prisma migrate dev' and commit it."
            exit 1
          fi

  e2e:
    name: Build, E2E & Accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: nauricare_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d nauricare_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/nauricare_ci
      NEXTAUTH_SECRET: ci-only-not-a-secret-0123456789abcdef
      NEXTAUTH_URL: http://localhost:3100
      E2E_BASE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema="$PRISMA_SCHEMA"
      - run: npx prisma migrate deploy --schema="$PRISMA_SCHEMA"
      - name: Build
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ env.TURNSTILE_TEST_SITE_KEY }}
        run: npm run build
      - name: Start the app
        working-directory: apps/web
        run: |
          nohup npx next start -p 3100 > ../../next.log 2>&1 &
          for _ in $(seq 1 60); do curl -fsS "$E2E_BASE_URL/api/health" >/dev/null && exit 0; sleep 1; done
          cat ../../next.log; exit 1
      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke + axe
        working-directory: apps/web
        run: npx playwright test
      - name: Lighthouse (budgets warn only)
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          urls: |
            http://localhost:3100/
            http://localhost:3100/login
          configPath: apps/web/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            next.log
          retention-days: 7

  # ===========================================================================
  # 2. IMAGE: built once per commit; deploys reference it by digest
  # ===========================================================================
  image:
    name: Build, Scan, Sign & Push Image
    runs-on: ubuntu-24.04
    needs: [quality, database, e2e]
    if: github.event_name == 'push'
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # AWS OIDC + keyless cosign signing
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      # OIDC when an IAM role is configured (vars.AWS_ROLE_ARN); long-lived
      # keys only as a fallback until infra/terraform's github-oidc module is applied.
      - name: AWS credentials (OIDC)
        if: vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: AWS credentials (static keys, legacy)
        if: vars.AWS_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Account Identity
        run: aws sts get-caller-identity

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The SHA tag is the release artifact. `latest`/`develop` are convenience
      # channels only; nothing deploys from them.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.ref_name == 'main' && 'latest' || 'develop' }}
          build-args: |
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image reference
        id: ref
        run: echo "image=${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - name: Scan image (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ref.outputs.image }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.ref.outputs.image }}
          format: spdx-json
          artifact-name: sbom-${{ github.sha }}.spdx.json

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign image (keyless, GitHub OIDC)
        run: cosign sign --yes "${{ steps.ref.outputs.image }}"

      - name: Summary
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: |
          {
            echo "### Image"
            echo "- \`$IMAGE\` (signed, SBOM attached)"
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # 3. DEPLOY
  # ===========================================================================
  # Skipped (not failed) until the staging service exists; set the
  # STAGING_ECS_SERVICE / STAGING_DNS_NAMES / STAGING_URL variables to enable.
  deploy-staging:
    name: Staging
    needs: image
    if: github.ref == 'refs/heads/develop' && vars.STAGING_ECS_SERVICE != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-ecs.yml
    with:
      environment: staging
      image: ${{ needs.image.outputs.image }}
      aws_region: us-east-1
      ecs_cluster: ${{ vars.STAGING_ECS_CLUSTER || 'nauricare-staging' }}
      ecs_service: ${{ vars.STAGING_ECS_SERVICE }}
      dns_names: ${{ vars.STAGING_DNS_NAMES }}
      public_url: ${{ vars.STAGING_URL }}
      check_url: ${{ vars.STAGING_URL }}
      ssm_prefix: /nauricare/staging/
    secrets: inherit

  # The `production` environment should require a reviewer
  # (Settings > Environments > production > Required reviewers).
  deploy-production:
    name: Production
    needs: image
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-ecs.yml
    with:
      environment: production
      image: ${{ needs.image.outputs.image }}
      aws_region: us-east-1
      # Pinned in the workflow on purpose (not repository variables), so a
      # stray variable can never redirect production deploys.
      ecs_cluster: default
      ecs_service: arn:aws:ecs:us-east-1:706162600712:service/default/nauricare-api-0acf
      dns_names: nauricare.org www.nauricare.org deploy-check.nauricare.org
      public_url: https://nauricare.org
      # deploy-check.* only ever points at ECS tasks, so it verifies the new
      # release even while the apex still shares traffic with the old server.
      check_url: https://deploy-check.nauricare.org
      ssm_prefix: /nauricare/production/
    secrets: inherit
