name: Infrastructure

# Terraform checks for infra/terraform/**.
#   Every PR/push: fmt, validate, tflint, Trivy misconfiguration scan (no AWS access).
#   PRs, once vars.TF_PLAN_ROLE_ARN is set: read-only `terraform plan` per root,
#     shown in the job summary. The plan role cannot read secret values or user data.
#   Apply is manual only: workflow_dispatch from main, gated by the protected
#     `infrastructure` environment (required reviewers), once vars.TF_APPLY_ROLE_ARN is set.
# Setup: infra/terraform/README.md.

on:
  pull_request:
    paths: ["infra/terraform/**", ".github/workflows/infra.yml"]
  push:
    branches: [main, develop]
    paths: ["infra/terraform/**", ".github/workflows/infra.yml"]
  workflow_dispatch:
    inputs:
      root:
        description: Terraform root to apply
        type: choice
        options: [envs/shared, envs/staging, envs/production]
        required: true

permissions:
  contents: read

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: false # never cancel a running apply

env:
  TF_VERSION: 1.17.2
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  static:
    name: Terraform fmt, validate, tflint & Trivy
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff
      - name: terraform validate
        run: |
          for root in bootstrap envs/shared envs/staging envs/production modules/rds; do
            echo "::group::$root"
            terraform -chdir="$root" init -backend=false -input=false >/dev/null
            terraform -chdir="$root" validate
            echo "::endgroup::"
          done
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.60.0
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids rate limits when downloading the AWS ruleset
        run: |
          tflint --init
          tflint --recursive -f compact
      - name: Trivy misconfiguration scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          severity: HIGH,CRITICAL
          exit-code: "1"

  plan:
    name: Plan (${{ matrix.root }})
    needs: static
    if: github.event_name == 'pull_request' && vars.TF_PLAN_ROLE_ARN != '' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        root: [envs/shared, envs/staging, envs/production]
    defaults:
      run:
        working-directory: infra/terraform/${{ matrix.root }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: terraform init
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          ROOT: ${{ matrix.root }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${ROOT#envs/}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}"
      - name: terraform plan
        env:
          TF_VAR_account_id: ${{ vars.AWS_ACCOUNT_ID }}
          TF_VAR_state_bucket_name: ${{ vars.TF_STATE_BUCKET }}
          TF_VAR_bootstrap_image: ${{ vars.TF_BOOTSTRAP_IMAGE }}
          ROOT: ${{ matrix.root }}
        run: |
          set +e
          terraform plan -lock-timeout=5m -no-color -detailed-exitcode -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          {
            echo "### Terraform plan: \`$ROOT\`"
            case $code in
              0) echo "No changes." ;;
              2) echo "Changes pending (apply with the Infrastructure workflow after merge)." ;;
              *) echo "**Plan failed.**" ;;
            esac
            echo '<details><summary>Plan output</summary>'
            echo
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          cat plan.txt
          [ "$code" -ne 1 ]

  apply:
    name: Apply (${{ inputs.root }})
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.TF_APPLY_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: infrastructure # required reviewers
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/terraform/${{ inputs.root }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: terraform init
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          ROOT: ${{ inputs.root }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${ROOT#envs/}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}"
      - name: terraform apply
        env:
          TF_VAR_account_id: ${{ vars.AWS_ACCOUNT_ID }}
          TF_VAR_state_bucket_name: ${{ vars.TF_STATE_BUCKET }}
          TF_VAR_bootstrap_image: ${{ vars.TF_BOOTSTRAP_IMAGE }}
        run: |
          terraform plan -lock-timeout=5m -out=tfplan
          terraform apply -lock-timeout=5m tfplan
